<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0B0D12">
  <title>Tournament Hub</title>
  <link rel="icon" href="assets/icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/tournament.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem('tournament-hub.v1') || 'null');
      if (saved && saved.settings && saved.settings.theme) {
        document.documentElement.setAttribute('data-theme', saved.settings.theme);
      }
    } catch (err) {}
  </script>
</head>
<body>
  <div id="boot" class="boot" role="status" aria-live="polite">
    <div class="boot-card">
      <div class="boot-mark"></div>
      <strong>Tournament Hub</strong>
      <p class="muted">Kupalar yükleniyor</p>
    </div>
  </div>
  <div class="app">
    <div id="nav-backdrop" class="nav-backdrop"></div>
    <aside class="sidebar">
      <a class="brand" href="#/dashboard">
        <img src="assets/icons/logo.svg" alt="">
        <span class="brand-text"><strong>Tournament Hub</strong><span>Kupa masası</span></span>
      </a>
      <nav id="sidenav" class="sidenav" aria-label="Ana menü"></nav>
      <button id="sidebar-user" class="sidebar-user" type="button">
        <span id="side-avatar"></span>
        <span><strong id="side-name">Ahmet</strong><small>Organizatör</small></span>
      </button>
    </aside>
    <div class="shell">
      <header class="topbar">
        <button id="nav-toggle" class="icon-btn only-mobile" type="button" aria-label="Menü">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="global-search" type="search" placeholder="Turnuva, takım veya oyuncu ara" autocomplete="off" aria-label="Ara">
          <div id="search-panel" class="search-panel" hidden></div>
        </div>
        <div class="top-actions">
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Tema değiştir"></button>
          <div class="bell-wrap">
            <button id="bell-btn" class="icon-btn" type="button" aria-label="Bildirimler">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
            <span class="bell-count" data-badge hidden>0</span>
          </button>
            <div id="bell-panel" class="bell-panel" hidden></div>
          </div>
          <button id="profile-chip" class="profile-chip" type="button">
            <span id="profile-avatar"></span>
            <span><strong id="profile-name">Ahmet</strong><small id="profile-role">Organizatör</small></span>
          </button>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/router.js"></script>
  <script src="js/matches.js"></script>
  <script src="js/bracket.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/tournament.js"></script>
  <script src="js/players.js"></script>
  <script src="js/teams.js"></script>
  <script src="js/rankings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
